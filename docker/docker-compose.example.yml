# Minimal whis daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change whis_PASSWORD first.
services:
  whis:
    image: ghcr.io/namangaonkar/whis:latest
    container_name: whis
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      whis_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # whis_HOSTNAMES: "whis.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./whis-home:/home/whis
      # Code visible to whis and the agents it launches.
      - ./workspace:/workspace
