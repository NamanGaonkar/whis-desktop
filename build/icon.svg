<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2218"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD369"/>
      <stop offset="50%" stop-color="#F5AF28"/>
      <stop offset="100%" stop-color="#C07D00"/>
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGlow)" stroke="#3D3222" stroke-width="12"/>

  <!-- Glowing Accent Hexagon / Terminal Window -->
  <rect x="68" y="68" width="376" height="376" rx="60" fill="#14110C" stroke="url(#goldGrad)" stroke-width="8" filter="url(#amberGlow)"/>

  <!-- Whis Waveform & Terminal Prompts -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Terminal Prompt Bracket > -->
    <path d="M 140 180 L 210 256 L 140 332" stroke-width="32"/>

    <!-- Cursor Underscore -->
    <line x1="240" y1="332" x2="330" y2="332" stroke-width="32"/>

    <!-- Sonic / Whis AI Accent Waves -->
    <circle cx="340" cy="200" r="14" fill="#FFD369"/>
    <path d="M 370 176 C 390 190, 390 210, 370 224" stroke-width="14"/>
    <path d="M 396 160 C 426 182, 426 218, 396 240" stroke-width="14"/>
  </g>
</svg>
